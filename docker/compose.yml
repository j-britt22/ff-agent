# Run from the repo root:  docker compose -f docker/compose.yml up -d --build
services:
  ff-monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ff-monitor
    restart: unless-stopped
    environment:
      TZ: America/New_York
      FF_SEASON: "2026"
    env_file:
      # ESPN cookies. chmod 600, gitignored, never baked into the image.
      - ../.env
      # SMTP host/user/app-password/to-address. SEPARATE file, so a leaked mail
      # password is not also a leaked league login.
      - ../.env.notify
    volumes:
      # The parquet cache persists between runs — §0.3 wants this to work
      # offline, and re-downloading nflverse every fifteen minutes would be
      # both slow and rude.
      - ../data/cache:/app/data/cache
      - ../logs:/app/logs        # §10's recommendation log
      - ../state:/app/state      # dedupe + last-success timestamps
    # §7.6: bound the blast radius of a runaway job.
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
