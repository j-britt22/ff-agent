[project]
name = "ff-agent"
version = "0.1.0"
description = "Fantasy football draft agent + league manager — First Down Syndrome (ESPN, 9-team, 2-QB, half-PPR)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16",
    "espn-api>=0.45",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "numpy>=2.5.2",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
markers = [
    "espn: requires valid ESPN credentials in .env",
    "network: performs a live fetch",
]

[tool.uv]
package = false
